version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A freshly published (possibly compromised) release is not proposed right away.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
    # Passes the PR title check and does not cut a release.
    commit-message:
      prefix: ci
