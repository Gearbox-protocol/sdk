name: Release

on:
  push:
    branches:
      - "master"
      - "next"
      - "*.x"

permissions:
  contents: read

env:
  HUSKY: 0
  CI: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true

      - name: Read Foundry version
        id: foundry
        run: echo "version=v$(node -p "require('./package.json').foundryVersion")" >> "$GITHUB_OUTPUT"

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ steps.foundry.outputs.version }}

      - name: Typecheck and test
        env:
          ALCHEMY_KEY: ${{ secrets.ALCHEMY_KEY_CI }}
          RPC_URL: "https://eth-mainnet.g.alchemy.com/v2/${{ secrets.ALCHEMY_KEY_CI }}"
        run: |
          pnpm typecheck:ci
          pnpm vitest run --project unit --project e2e

      # Backend releases depend on prereleases from `next`, so there failing
      # backend client tests must not block the release.
      - name: Backend client tests
        continue-on-error: ${{ github.ref_name == 'next' }}
        run: pnpm test:api

      - name: Build
        run: pnpm build

      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
