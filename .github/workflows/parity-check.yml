name: Parity check

on:
  workflow_dispatch:
    inputs:
      backend_url:
        description: Backend URL to compare against
        required: false
        default: https://api.gear-dev.dev
        type: string
  # schedule:
  #   - cron: "0 6 * * *"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  HUSKY: 0
  CI: true
  BACKEND_URL: ${{ inputs.backend_url || 'https://api.gear-dev.dev' }}

jobs:
  opportunities:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          cache: true
          require-lockfile: true

      - name: Compare opportunities
        env:
          ALCHEMY_KEY: ${{ secrets.ALCHEMY_KEY_CI }}
          SOMNIA_PROVIDER: ${{ secrets.SOMNIA_PROVIDER }}
          ETHERLINK_PROVIDER: ${{ secrets.ETHERLINK_PROVIDER }}
        run: pnpm tsx ci/compare-opportunities.ts

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opportunities-compare
          path: tmp/opportunities-compare/*.json
          if-no-files-found: warn

  positions:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          cache: true
          require-lockfile: true

      - name: Compare positions
        env:
          ALCHEMY_KEY: ${{ secrets.ALCHEMY_KEY_CI }}
          SOMNIA_PROVIDER: ${{ secrets.SOMNIA_PROVIDER }}
          ETHERLINK_PROVIDER: ${{ secrets.ETHERLINK_PROVIDER }}
        run: pnpm tsx ci/compare-positions.ts

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: positions-compare
          path: tmp/positions-compare/*.json
          if-no-files-found: warn

  notify:
    needs: [opportunities, positions]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Notify success
        if: ${{ needs.opportunities.result == 'success' && needs.positions.result == 'success' }}
        uses: appleboy/telegram-action@68ac04bda0e0f4755e24649161566b4b6732cc83 # v1.1.2
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          to: ${{ vars.TELEGRAM_MAINNET_NOTIFICATIONS }}
          message: |
            SDK onchain/offcain parity check succeeded
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Notify failure
        if: ${{ needs.opportunities.result != 'success' || needs.positions.result != 'success' }}
        uses: appleboy/telegram-action@68ac04bda0e0f4755e24649161566b4b6732cc83 # v1.1.2
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          to: ${{ vars.TELEGRAM_MAINNET_ALERTS }}
          message: |
            SDK onchain/offcain parity check failed (opportunities: ${{ needs.opportunities.result }}, positions: ${{ needs.positions.result }})
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
