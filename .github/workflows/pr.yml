name: Check PR

on:
  pull_request:
    types: [opened, reopened, synchronize]

env:
  HUSKY: 0
  CI: true

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true

      - name: Read Foundry version
        id: foundry
        run: echo "version=v$(node -p "require('./package.json').foundryVersion")" >> "$GITHUB_OUTPUT"

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ steps.foundry.outputs.version }}

      - name: Perform checks
        env:
          ALCHEMY_KEY: ${{ secrets.ALCHEMY_KEY_CI }}
          RPC_URL: "https://eth-mainnet.g.alchemy.com/v2/${{ secrets.ALCHEMY_KEY_CI }}"
        run: |
          pnpm typecheck:ci
          pnpm check:ci
          pnpm test:all
